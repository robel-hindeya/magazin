<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <!-- Nyala Spiral Horns -->
    <linearGradient id="nyalaHorn" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="50%" stop-color="#607d8b"/>
      <stop offset="85%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#fff9c4"/>
    </linearGradient>
    <!-- Coat Gradient -->
    <radialGradient id="nyalaCoat" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="70%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </radialGradient>
    <radialGradient id="nyalaMuzzle" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#efebe9"/>
      <stop offset="100%" stop-color="#d7ccc8"/>
    </radialGradient>
    <radialGradient id="nyalaEye" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#795548"/>
      <stop offset="60%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#1b0000"/>
    </radialGradient>
    <filter id="nyalaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#nyalaGlow)">
    <!-- SPIRAL LYRE HORNS -->
    <!-- Left Spiral Horn -->
    <path d="M 100 80 C 85 45, 60 30, 48 15 C 44 10, 52 8, 56 12 C 72 26, 92 48, 108 80 Z" fill="url(#nyalaHorn)"/>
    <path d="M 60 22 Q 68 28 72 38" stroke="#eceff1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 75 42 Q 84 50 88 62" stroke="#eceff1" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Spiral Horn -->
    <path d="M 140 80 C 155 45, 180 30, 192 15 C 196 10, 188 8, 184 12 C 168 26, 148 48, 132 80 Z" fill="url(#nyalaHorn)"/>
    <path d="M 180 22 Q 172 28 168 38" stroke="#eceff1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 165 42 Q 156 50 152 62" stroke="#eceff1" stroke-width="3" stroke-linecap="round"/>

    <!-- EARS -->
    <!-- Left Ear -->
    <ellipse cx="60" cy="95" rx="25" ry="14" fill="#5d4037" transform="rotate(-30 60 95)"/>
    <ellipse cx="60" cy="95" rx="16" ry="8" fill="#ffffff" transform="rotate(-30 60 95)"/>
    <!-- Right Ear -->
    <ellipse cx="180" cy="95" rx="25" ry="14" fill="#3e2723" transform="rotate(30 180 95)"/>
    <ellipse cx="180" cy="95" rx="16" ry="8" fill="#ffffff" transform="rotate(30 180 95)"/>

    <!-- HEAD -->
    <ellipse cx="120" cy="120" rx="50" ry="46" fill="url(#nyalaCoat)"/>

    <!-- WHITE FACIAL SPOTS (Signature Mountain Nyala dots on cheeks) -->
    <circle cx="78" cy="128" r="3.5" fill="#ffffff"/>
    <circle cx="72" cy="136" r="3" fill="#ffffff"/>
    <circle cx="162" cy="128" r="3.5" fill="#ffffff"/>
    <circle cx="168" cy="136" r="3" fill="#ffffff"/>

    <!-- WHITE NOSE BRIDGE CHEVRON (White band between eyes) -->
    <path d="M 104 116 Q 120 124 136 116" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- MUZZLE -->
    <ellipse cx="120" cy="144" rx="30" ry="24" fill="url(#nyalaMuzzle)"/>

    <!-- NOSE -->
    <path d="M 112 135 C 112 131, 128 131, 128 135 C 128 141, 120 144, 120 144 C 120 144, 112 141, 112 135 Z" fill="#212121"/>

    <!-- MOUTH -->
    <path d="M 120 144 L 120 152 M 112 150 Q 120 157 128 150" stroke="#212121" stroke-width="2.5" stroke-linecap="round"/>

    <!-- BIG GENTLE SOULFUL EYES -->
    <!-- Left Eye -->
    <ellipse cx="94" cy="110" rx="13" ry="15" fill="#1b0000"/>
    <ellipse cx="94" cy="110" rx="11" ry="13" fill="url(#nyalaEye)"/>
    <circle cx="90" cy="105" r="4.5" fill="#ffffff"/>
    <circle cx="97" cy="115" r="2" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="146" cy="110" rx="13" ry="15" fill="#1b0000"/>
    <ellipse cx="146" cy="110" rx="11" ry="13" fill="url(#nyalaEye)"/>
    <circle cx="142" cy="105" r="4.5" fill="#ffffff"/>
    <circle cx="149" cy="115" r="2" fill="#ffffff"/>

    <!-- WHITE THROAT CRESCENT -->
    <path d="M 98 174 Q 120 190 142 174" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- ROSY CHEEKS -->
    <ellipse cx="80" cy="132" rx="8" ry="5" fill="#ff7043" opacity="0.35"/>
    <ellipse cx="160" cy="132" rx="8" ry="5" fill="#ff7043" opacity="0.35"/>

    <!-- CLOUD FOREST FLOWER GARLAND -->
    <circle cx="106" cy="80" r="5" fill="#ec4899"/>
    <circle cx="120" cy="76" r="6" fill="#a855f7"/>
    <circle cx="134" cy="80" r="5" fill="#10b981"/>
    <circle cx="120" cy="76" r="2.5" fill="#fbbf24"/>
  </g>
</svg>
