<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <!-- Gelada Golden Lion Mane -->
    <radialGradient id="geladaMane" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="85%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#b26a00"/>
    </radialGradient>
    <!-- Face Gradient -->
    <radialGradient id="geladaFace" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="70%" stop-color="#6d4c41"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </radialGradient>
    <!-- Heart Chest Gradient -->
    <radialGradient id="geladaHeart" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="70%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </radialGradient>
    <!-- Eye Gradient -->
    <radialGradient id="geladaEye" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="55%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#211103"/>
    </radialGradient>
    <filter id="geladaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#geladaGlow)">
    <!-- MASSIVE FLUFFY GOLDEN MANE WITH SPIKY TUFTS -->
    <path d="M 120 22 C 160 20, 205 50, 215 95 C 225 140, 195 180, 165 205 C 135 220, 105 220, 75 205 C 45 180, 15 140, 25 95 C 35 50, 80 20, 120 22 Z" fill="url(#geladaMane)"/>

    <!-- Outer Mane Petals / Tufts for cartoon volume -->
    <circle cx="50" cy="55" r="28" fill="#ffb300"/>
    <circle cx="190" cy="55" r="28" fill="#ffb300"/>
    <circle cx="32" cy="105" r="26" fill="#f57c00"/>
    <circle cx="208" cy="105" r="26" fill="#f57c00"/>
    <circle cx="48" cy="155" r="26" fill="#f57c00"/>
    <circle cx="192" cy="155" r="26" fill="#f57c00"/>
    <circle cx="120" cy="24" r="26" fill="#ffd54f"/>

    <!-- EARS -->
    <ellipse cx="60" cy="110" rx="16" ry="18" fill="#4e342e"/>
    <ellipse cx="60" cy="110" rx="10" ry="12" fill="#ffab91"/>
    <ellipse cx="180" cy="110" rx="16" ry="18" fill="#4e342e"/>
    <ellipse cx="180" cy="110" rx="10" ry="12" fill="#ffab91"/>

    <!-- CHEST AREA WITH SIGNATURE RED HEART / HOURGLASS PATCH -->
    <path d="M 95 185 C 80 185, 80 205, 95 218 L 120 236 L 145 218 C 160 205, 160 185, 145 185 C 132 185, 124 195, 120 200 C 116 195, 108 185, 95 185 Z" fill="url(#geladaHeart)"/>
    <!-- White Fur Border Around Heart -->
    <path d="M 95 185 C 80 185, 80 205, 95 218 L 120 236 L 145 218 C 160 205, 160 185, 145 185" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- ROUND FACE -->
    <ellipse cx="120" cy="114" rx="48" ry="46" fill="url(#geladaFace)"/>

    <!-- CHEEK TUFTS -->
    <path d="M 72 120 Q 56 128 62 138 Q 78 138 86 130 Z" fill="#bcaaa4"/>
    <path d="M 168 120 Q 184 128 178 138 Q 162 138 154 130 Z" fill="#bcaaa4"/>

    <!-- SNOUT -->
    <ellipse cx="120" cy="132" rx="26" ry="20" fill="#3e2723"/>

    <!-- NOSTRILS (Upturned cute baboon nostrils) -->
    <ellipse cx="114" cy="128" rx="4.5" ry="5.5" fill="#1b0000"/>
    <ellipse cx="126" cy="128" rx="4.5" ry="5.5" fill="#1b0000"/>

    <!-- BIG PLAYFUL SMILE -->
    <path d="M 106 142 Q 120 152 134 142" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 104 140 Q 120 154 136 140" stroke="#1b0000" stroke-width="2.5" fill="none"/>

    <!-- BIG EXPRESSIVE EYES -->
    <!-- Left Eye -->
    <ellipse cx="96" cy="104" rx="14" ry="16" fill="#1b1109"/>
    <ellipse cx="96" cy="104" rx="12" ry="14" fill="url(#geladaEye)"/>
    <ellipse cx="96" cy="104" rx="7" ry="12" fill="#1b1109"/>
    <circle cx="92" cy="98" r="4.5" fill="#ffffff"/>
    <circle cx="99" cy="109" r="2" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="144" cy="104" rx="14" ry="16" fill="#1b1109"/>
    <ellipse cx="144" cy="104" rx="12" ry="14" fill="url(#geladaEye)"/>
    <ellipse cx="144" cy="104" rx="7" ry="12" fill="#1b1109"/>
    <circle cx="140" cy="98" r="4.5" fill="#ffffff"/>
    <circle cx="147" cy="109" r="2" fill="#ffffff"/>

    <!-- WHITE EYELIDS / BROW ACCENT (Characteristic Gelada flashing eyelids) -->
    <path d="M 82 88 Q 96 82 110 88" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 158 88 Q 144 82 130 88" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>

    <!-- ROSY CHEEKS -->
    <ellipse cx="78" cy="124" rx="8" ry="5" fill="#ff7043" opacity="0.4"/>
    <ellipse cx="162" cy="124" rx="8" ry="5" fill="#ff7043" opacity="0.4"/>

    <!-- GOLDEN HIGHLAND WRITING FEATHER ON HEAD -->
    <path d="M 120 30 Q 135 8 145 14 Q 138 28 126 38 Z" fill="#38bdf8"/>
    <path d="M 120 30 L 140 12" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>
