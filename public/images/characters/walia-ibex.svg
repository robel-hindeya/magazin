<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <!-- Horn Gradients -->
    <linearGradient id="ibexHornLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="40%" stop-color="#8d6e63"/>
      <stop offset="80%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#f5efe6"/>
    </linearGradient>
    <linearGradient id="ibexHornRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="40%" stop-color="#6d4c41"/>
      <stop offset="80%" stop-color="#bcaaa4"/>
      <stop offset="100%" stop-color="#efebe9"/>
    </linearGradient>
    <!-- Fur Gradients -->
    <radialGradient id="ibexHead" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#d7a15c"/>
      <stop offset="65%" stop-color="#b07d38"/>
      <stop offset="100%" stop-color="#83561a"/>
    </radialGradient>
    <radialGradient id="ibexMuzzle" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff5e6"/>
      <stop offset="70%" stop-color="#f5dec2"/>
      <stop offset="100%" stop-color="#d9b68c"/>
    </radialGradient>
    <radialGradient id="ibexEye" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="50%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#211103"/>
    </radialGradient>
    <!-- Drop Glow Filter -->
    <filter id="waliaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#waliaGlow)">
    <!-- LEFT HORN (Curved backwards arch) -->
    <path d="M 96 82 C 78 40, 42 22, 22 40 C 8 54, 18 80, 24 74 C 32 60, 60 48, 86 86 Z" fill="url(#ibexHornLeft)"/>
    <!-- Left Horn Ridges -->
    <path d="M 82 72 Q 74 65 68 68" stroke="#3e2723" stroke-width="3" stroke-linecap="round"/>
    <path d="M 68 58 Q 58 52 52 56" stroke="#3e2723" stroke-width="3" stroke-linecap="round"/>
    <path d="M 52 46 Q 42 42 38 48" stroke="#3e2723" stroke-width="3" stroke-linecap="round"/>
    <path d="M 38 38 Q 30 36 28 42" stroke="#3e2723" stroke-width="2.5" stroke-linecap="round"/>

    <!-- RIGHT HORN (Curved backwards arch) -->
    <path d="M 144 82 C 162 40, 198 22, 218 40 C 232 54, 222 80, 216 74 C 208 60, 180 48, 154 86 Z" fill="url(#ibexHornRight)"/>
    <!-- Right Horn Ridges -->
    <path d="M 158 72 Q 166 65 172 68" stroke="#2e1c14" stroke-width="3" stroke-linecap="round"/>
    <path d="M 172 58 Q 182 52 188 56" stroke="#2e1c14" stroke-width="3" stroke-linecap="round"/>
    <path d="M 188 46 Q 198 42 202 48" stroke="#2e1c14" stroke-width="3" stroke-linecap="round"/>
    <path d="M 202 38 Q 210 36 212 42" stroke="#2e1c14" stroke-width="2.5" stroke-linecap="round"/>

    <!-- EARS -->
    <!-- Left Ear -->
    <ellipse cx="64" cy="98" rx="22" ry="12" fill="#b07d38" transform="rotate(-35 64 98)"/>
    <ellipse cx="65" cy="98" rx="15" ry="7" fill="#ffccbc" transform="rotate(-35 65 98)"/>
    <!-- Right Ear -->
    <ellipse cx="176" cy="98" rx="22" ry="12" fill="#83561a" transform="rotate(35 176 98)"/>
    <ellipse cx="175" cy="98" rx="15" ry="7" fill="#ffab91" transform="rotate(35 175 98)"/>

    <!-- HEAD -->
    <ellipse cx="120" cy="120" rx="52" ry="48" fill="url(#ibexHead)"/>
    <!-- Forehead Tuft -->
    <path d="M 108 76 Q 120 66 124 74 Q 132 68 134 78 Z" fill="#d7a15c"/>

    <!-- MUZZLE & CHIN -->
    <ellipse cx="120" cy="144" rx="34" ry="26" fill="url(#ibexMuzzle)"/>
    <!-- Cute Little Goatee Beard -->
    <path d="M 112 168 Q 120 188 122 192 Q 128 188 128 168 Z" fill="#f5dec2"/>
    <path d="M 116 170 Q 121 184 122 188" stroke="#d7a15c" stroke-width="2" stroke-linecap="round"/>

    <!-- NOSE -->
    <path d="M 112 134 C 112 130, 128 130, 128 134 C 128 140, 120 143, 120 143 C 120 143, 112 140, 112 134 Z" fill="#3e2723"/>

    <!-- MOUTH & SMILE -->
    <path d="M 120 143 L 120 152 M 110 150 Q 120 158 130 150" stroke="#3e2723" stroke-width="3" stroke-linecap="round"/>

    <!-- BIG SPARKLY EYES -->
    <!-- Left Eye -->
    <ellipse cx="94" cy="112" rx="13" ry="15" fill="#1b1109"/>
    <ellipse cx="94" cy="112" rx="11" ry="13" fill="url(#ibexEye)"/>
    <ellipse cx="94" cy="112" rx="7" ry="12" fill="#0d0703"/>
    <!-- Highlights -->
    <circle cx="90" cy="107" r="4.5" fill="#ffffff"/>
    <circle cx="97" cy="117" r="2" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="146" cy="112" rx="13" ry="15" fill="#1b1109"/>
    <ellipse cx="146" cy="112" rx="11" ry="13" fill="url(#ibexEye)"/>
    <ellipse cx="146" cy="112" rx="7" ry="12" fill="#0d0703"/>
    <!-- Highlights -->
    <circle cx="142" cy="107" r="4.5" fill="#ffffff"/>
    <circle cx="149" cy="117" r="2" fill="#ffffff"/>

    <!-- ROSY CHEEKS -->
    <ellipse cx="76" cy="132" rx="9" ry="5.5" fill="#ff7043" opacity="0.45"/>
    <ellipse cx="164" cy="132" rx="9" ry="5.5" fill="#ff7043" opacity="0.45"/>

    <!-- EMERALD SIMIEN SCARF -->
    <path d="M 88 160 Q 120 176 152 160 Q 160 172 150 182 Q 120 196 90 182 Q 80 172 88 160 Z" fill="#10b981"/>
    <!-- Golden Knot & Tails -->
    <circle cx="120" cy="180" r="7" fill="#fbbf24"/>
    <path d="M 116 186 L 108 206 L 120 202 L 126 206 L 122 186 Z" fill="#059669"/>
    <circle cx="120" cy="180" r="3.5" fill="#ffffff"/>
  </g>
</svg>
